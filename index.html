<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIN'S PROJECT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060716;color:#e9f7ff;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}
video{display:none}canvas{position:fixed;inset:0;width:100%;height:100%}
header{position:fixed;top:max(18px,env(safe-area-inset-top));left:16px;z-index:2;pointer-events:none}
h1{font-size:clamp(17px,3vw,28px);margin:0;letter-spacing:.08em;text-shadow:0 0 20px #00e5ff}
p{margin:6px 0;font-size:13px;color:#b8c9e8}
#status{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:12px;z-index:3;background:#081125cc;border:1px solid #24c5ff55;padding:10px 14px;border-radius:12px;font-size:11px;max-width:calc(100vw - 24px)}
#mode{position:fixed;top:max(78px,calc(env(safe-area-inset-top) + 58px));right:12px;z-index:3;background:#081125cc;border:1px solid #24c5ff55;border-radius:12px;padding:10px 14px;font-size:13px}
#clear{position:fixed;right:12px;bottom:80px;z-index:4;border:1px solid #7eefff;background:#061d31;color:white;border-radius:10px;padding:10px 14px;cursor:pointer;display:none}
#startScreen{position:fixed;inset:0;z-index:20;background:#060716ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}#startCamera{background:#0be0ff;color:#061021;border:0;border-radius:14px;padding:15px 26px;font-size:18px;font-weight:800}#rotate{display:none;position:fixed;inset:0;z-index:15;background:#060716ed;align-items:center;justify-content:center;text-align:center;padding:25px;font-size:22px;font-weight:700} @media(max-height:550px){header{top:8px;left:12px}h1{font-size:17px}header p{font-size:10px}#mode{top:8px;right:8px;font-size:11px;padding:7px}#status{bottom:7px;left:8px;font-size:10px;padding:7px;max-width:65vw}#clear{right:8px;bottom:8px;padding:8px;font-size:12px}}
@media(orientation:portrait){header p{max-width:70vw;font-size:11px}#mode{font-size:11px;padding:7px 9px}#status{font-size:10px}}
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas><canvas id="drawing" style="pointer-events:none"></canvas>
<header><h1>AIN'S PROJECT</h1><p id="hint">✋ Spider · Two L: Frame · ☝ Draw · ✌ Erase · ✨ Face Mesh Always On</p></header>
<div id="mode">MODE 1 · SPIDER WEB</div>
<div id="status">Tap Start Camera to begin</div><div id="startScreen"><h1>AIN’S PROJECT</h1><p>iPhone Portrait 9:16 · Face Mesh + 3 Modes</p><button id="startCamera">Start Camera 📷</button><p>Allow camera access in Safari when prompted.</p></div><button id="clear">Clear Drawing</button>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const drawing=document.getElementById('drawing'),dctx=drawing.getContext('2d');
const statusEl=document.getElementById('status'),modeEl=document.getElementById('mode'),clearBtn=document.getElementById('clear');
let latest=[],facePoints=[],mode=1,gestureLocked=false,lastSwitch=0,prevPen=null,prevErase=null;
let handBusy=false,faceBusy=false,lastHandFrame=0,lastFaceFrame=0;
const names={1:'SPIDER WEB',2:'MAGIC PHOTO FRAME',3:'AIR DRAWING'};
const mirrored=document.createElement('canvas'),mctx=mirrored.getContext('2d');
function resize(){const dpr=Math.min(devicePixelRatio||1,2);const old=document.createElement('canvas');old.width=drawing.width;old.height=drawing.height;old.getContext('2d').drawImage(drawing,0,0);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);drawing.width=Math.round(innerWidth*dpr);drawing.height=Math.round(innerHeight*dpr);dctx.setTransform(dpr,0,0,dpr,0,0);if(old.width)dctx.drawImage(old,0,0,old.width,old.height,0,0,innerWidth,innerHeight);mirrored.width=innerWidth;mirrored.height=innerHeight}
addEventListener('resize',resize);resize();
function cameraFit(){const vw=video.videoWidth||720,vh=video.videoHeight||1280;const scale=Math.min(innerWidth/vw,innerHeight/vh);return{vw,vh,scale,dx:(innerWidth-vw*scale)/2,dy:(innerHeight-vh*scale)/2}}
function point(p){const f=cameraFit();return{x:f.dx+(1-p.x)*f.vw*f.scale,y:f.dy+p.y*f.vh*f.scale}}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function fingerUp(h,tip,pip,mcp){return distance(h[tip],h[0])>distance(h[pip],h[0])*1.12&&distance(h[tip],h[mcp])>distance(h[pip],h[mcp])*1.3}
function state(h){return{index:fingerUp(h,8,6,5),middle:fingerUp(h,12,10,9),ring:fingerUp(h,16,14,13),pinky:fingerUp(h,20,18,17),thumb:distance(h[4],h[5])>distance(h[3],h[5])*1.12}}
function isOne(s){return s.index&&!s.middle&&!s.ring&&!s.pinky&&!s.thumb}
function isTwo(s){return s.index&&s.middle&&!s.ring&&!s.pinky&&!s.thumb}
function isPalm(s){return s.index&&s.middle&&s.ring&&s.pinky&&s.thumb}
function isL(s){return s.index&&s.thumb&&!s.middle&&!s.ring&&!s.pinky}
function twoL(hands){if(hands.length!==2)return false;let [a,b]=hands;if(point(a[0]).x>point(b[0]).x)[a,b]=[b,a];const sa=state(a),sb=state(b);if(!isL(sa)||!isL(sb))return false;
// Both thumbs must point toward the middle of the mirrored image.
const la=point(a[4]),lb=point(b[4]),lai=point(a[5]),lbi=point(b[5]);
return la.x>lai.x+12&&lb.x<lbi.x-12;
}
function chooseGesture(hands){if(twoL(hands))return 2;if(hands.some(h=>isPalm(state(h))))return 1;if(hands.length===1&&isOne(state(hands[0])))return 3;return 0}
function changeMode(next){
  mode=next;gestureLocked=true;lastSwitch=performance.now();prevPen=null;prevErase=null;
  modeEl.textContent=`MODE ${mode} · ${names[mode]}`;
  clearBtn.style.display=mode===3?'block':'none';
}
// Instant switch: no countdown. Lock until the switching gesture is released.
function updateGesture(){
  const target=chooseGesture(latest);
  if(!target){gestureLocked=false;return}
  if(target===mode)return;
  if(gestureLocked||performance.now()-lastSwitch<350)return;
  changeMode(target);
}
function glowDot(x,y,hue,r=3){ctx.save();ctx.shadowBlur=17;ctx.shadowColor=`hsl(${hue},100%,65%)`;ctx.fillStyle=`hsl(${hue},100%,82%)`;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function line(a,b,hue,alpha=.65,width=.8){ctx.save();ctx.globalAlpha=alpha;ctx.lineWidth=width;ctx.shadowBlur=8;ctx.shadowColor=`hsl(${hue},100%,65%)`;const g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);g.addColorStop(0,'#f678ff');g.addColorStop(.5,`hsl(${hue},100%,75%)`);g.addColorStop(1,'#e7ff80');ctx.strokeStyle=g;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}
function spider(hands,t){hands.forEach((h,k)=>h.forEach((p,i)=>glowDot(p.x,p.y,(i*13+k*130+t*.015)%360,i%4===0?3.8:2.4)));
if(hands.length!==2)return;let[a,b]=hands;if(a[0].x>b[0].x)[a,b]=[b,a];const ids=[4,8,12,16,20];const separation=distance(a[0],b[0]);const hue=180+Math.min(100,separation/innerWidth*100);
for(let i=0;i<5;i++)for(let j=0;j<5;j++){const aa=a[ids[i]],bb=b[ids[j]],wobble=Math.sin(t*.002+i*1.7+j*.9)*Math.min(13,separation*.025);line({x:aa.x,y:aa.y+wobble},{x:bb.x,y:bb.y-wobble},hue+i*14+j*5,.15+(i===j?.52:.08),i===j?1.2:.55)}}
function frame(hands,t){hands.forEach(h=>[4,8].forEach(i=>glowDot(h[i].x,h[i].y,190,5)));if(hands.length!==2)return;
let[a,b]=hands;if(a[0].x>b[0].x)[a,b]=[b,a];
const left=Math.min(a[8].x,a[4].x),right=Math.max(b[8].x,b[4].x);
const top=Math.min(a[8].y,b[8].y),bottom=Math.max(a[4].y,b[4].y);
if(right-left<65||bottom-top<55)return;
ctx.save();ctx.beginPath();ctx.rect(left,top,right-left,bottom-top);ctx.clip();ctx.filter='grayscale(100%) contrast(1.15)';ctx.drawImage(mirrored,0,0,innerWidth,innerHeight);ctx.restore();
ctx.save();ctx.strokeStyle='#baf7ff';ctx.lineWidth=3;ctx.shadowBlur=22;ctx.shadowColor='#00eaff';ctx.strokeRect(left,top,right-left,bottom-top);ctx.restore();
ctx.save();ctx.font='12px system-ui';ctx.fillStyle='#d8faff';ctx.fillText('LIVE FRAME',left+8,Math.max(18,top-8));ctx.restore()}
function draw(hands){if(hands.length!==1){prevPen=null;prevErase=null;return}const h=hands[0],s=state(latest[0]);const p=h[8];
if(isOne(s)){prevErase=null;glowDot(p.x,p.y,190,7);if(prevPen&&distance(p,prevPen)<120){dctx.save();dctx.strokeStyle='#a8f9ff';dctx.lineWidth=5;dctx.lineCap='round';dctx.lineJoin='round';dctx.shadowColor='#00cfff';dctx.shadowBlur=12;dctx.beginPath();dctx.moveTo(prevPen.x,prevPen.y);dctx.lineTo(p.x,p.y);dctx.stroke();dctx.restore()}prevPen=p}
else if(isTwo(s)){prevPen=null;const e={x:(h[8].x+h[12].x)/2,y:(h[8].y+h[12].y)/2};dctx.save();dctx.globalCompositeOperation='destination-out';dctx.beginPath();dctx.arc(e.x,e.y,25,0,Math.PI*2);dctx.fill();if(prevErase&&distance(e,prevErase)<120){dctx.lineWidth=50;dctx.lineCap='round';dctx.strokeStyle='black';dctx.beginPath();dctx.moveTo(prevErase.x,prevErase.y);dctx.lineTo(e.x,e.y);dctx.stroke()}dctx.restore();prevErase=e;ctx.save();ctx.strokeStyle='#ffec8c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,25,0,Math.PI*2);ctx.stroke();ctx.restore()}
else{prevPen=null;prevErase=null}}
// Persistent gold face-wireframe overlay (no hand gesture required).
// Draw a lightweight subset of MediaPipe's face tessellation to keep iPhone responsive.
function drawFaceMesh(t){
 if(!facePoints.length)return;
 const pts=facePoints.map(point);
 const links=window.FACEMESH_TESSELATION || [];
 ctx.save();
 ctx.strokeStyle='rgba(255,220,100,.50)';ctx.lineWidth=.65;
 ctx.shadowColor='#ffd54d';ctx.shadowBlur=3;
 ctx.beginPath();
 // ~400 edges instead of the full dense tessellation on mobile.
 for(let i=0;i<links.length;i+=6){const edge=links[i];if(!edge)continue;const a=pts[edge[0]],b=pts[edge[1]];if(a&&b){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}}
 ctx.stroke();
 ctx.shadowBlur=8;
 for(let i=0;i<pts.length;i+=3){const p=pts[i];ctx.fillStyle='rgba(255,223,110,.80)';ctx.fillRect(p.x-0.65,p.y-0.65,1.3,1.3)}
 // Emphasize recognizable face silhouette, eyes and lips.
 ctx.strokeStyle='rgba(255,236,155,.88)';ctx.lineWidth=1.25;ctx.shadowBlur=8;
 const groups=[window.FACEMESH_FACE_OVAL,window.FACEMESH_LEFT_EYE,window.FACEMESH_RIGHT_EYE,window.FACEMESH_LIPS];
 for(const group of groups){if(!group)continue;ctx.beginPath();for(const [a,b] of group){if(pts[a]&&pts[b]){ctx.moveTo(pts[a].x,pts[a].y);ctx.lineTo(pts[b].x,pts[b].y)}}ctx.stroke()}
 ctx.restore();
}
function render(t){ctx.clearRect(0,0,innerWidth,innerHeight);if(video.readyState>=2){mctx.save();mctx.clearRect(0,0,innerWidth,innerHeight);mctx.translate(innerWidth,0);mctx.scale(-1,1);const f=cameraFit();mctx.drawImage(video,f.dx,f.dy,f.vw*f.scale,f.vh*f.scale);mctx.restore();ctx.save();ctx.globalAlpha=.58;ctx.drawImage(mirrored,0,0,innerWidth,innerHeight);ctx.restore();ctx.fillStyle='rgba(3,5,18,.30)';ctx.fillRect(0,0,innerWidth,innerHeight)}else{ctx.fillStyle='#060716';ctx.fillRect(0,0,innerWidth,innerHeight)}
const hands=latest.map(h=>h.map(point));drawFaceMesh(t);if(mode===1)spider(hands,t);else if(mode===2)frame(hands,t);else if(mode===3)draw(hands);
requestAnimationFrame(render)}requestAnimationFrame(render);
clearBtn.onclick=()=>dctx.clearRect(0,0,innerWidth,innerHeight);
async function start(){
 const btn=document.getElementById('startCamera');btn.disabled=true;btn.textContent='Starting…';
 try{
  if(!window.Hands||!window.FaceMesh)throw Error('MediaPipe scripts did not load. Check internet.');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480},aspectRatio:{ideal:4/3}},audio:false});
  video.srcObject=stream;await video.play();
  document.getElementById('startScreen').style.display='none';
  const hands=new Hands({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`});
  hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.55});
  hands.onResults(results=>{
   latest=results.multiHandLandmarks||[];
   updateGesture();
   statusEl.textContent=`Camera ${video.videoWidth}×${video.videoHeight} · ${latest.length} hands · Face Mesh ON · Instant gestures`;
  });
  const faces=new FaceMesh({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${file}`});
  faces.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.5,minTrackingConfidence:.5});
  faces.onResults(results=>{facePoints=(results.multiFaceLandmarks||[])[0]||[]});
  // Run models independently and at modest frame rates to reduce iPhone heat/lag.
  async function detect(time){
   if(video.readyState>=2){
    if(!handBusy&&time-lastHandFrame>75){handBusy=true;lastHandFrame=time;hands.send({image:video}).catch(e=>{statusEl.textContent='Hand tracking: '+e.message}).finally(()=>{handBusy=false})}
    if(!faceBusy&&time-lastFaceFrame>110){faceBusy=true;lastFaceFrame=time;faces.send({image:video}).catch(e=>{statusEl.textContent='Face tracking: '+e.message}).finally(()=>{faceBusy=false})}
   }
   requestAnimationFrame(detect);
  }
  requestAnimationFrame(detect);
 }catch(e){statusEl.textContent='Could not start: '+e.message;btn.disabled=false;btn.textContent='Try Again'}
}
document.getElementById('startCamera').addEventListener('click',start);
</script>
</body>
</html>
